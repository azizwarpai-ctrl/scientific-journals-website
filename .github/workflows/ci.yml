name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bunx eslint .

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: e2e_digitopub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pe2e_root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:e2e_root@127.0.0.1:3306/e2e_digitopub
      JWT_SECRET: e2e-ci-jwt-secret-not-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_EMAIL: e2e-admin@example.com
      ADMIN_PASSWORD: e2e-ci-password-1
      OTP_DELIVERY_METHOD: console
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bunx prisma generate && bunx prisma migrate deploy

      - name: Seed E2E admin
        run: bun run scripts/seed-e2e-admin.ts

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.results/
          retention-days: 7
